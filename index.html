<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QMem</title>
  </head>
  <body>
    <!-- 通常画面では、このテキストエリアだけを画面全体に表示する。 -->
    <textarea id="editor" aria-label="メモ本文" autofocus spellcheck="false"></textarea>
    <!-- Cmd/Ctrl+K で開く、過去メモ検索用のモーダル。 -->
    <dialog id="search-dialog" aria-label="過去メモ検索">
      <div class="search-field">
        <svg class="search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </svg>
        <input id="query" type="search" aria-label="本文を検索" placeholder="本文を検索" autocomplete="off" />
      </div>
      <div id="results" aria-label="検索結果"></div>
    </dialog>
    <!-- Cmd+, で必要な場合だけ開く設定。通常画面には管理UIを残さない。 -->
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-header"><h1 id="settings-title">設定</h1><button id="settings-close" type="button" aria-label="設定を閉じる">Esc</button></div>
      <section class="settings-section" aria-labelledby="general-title">
        <h2 id="general-title">一般</h2>
        <label class="setting-row"><span><span class="setting-label">ログイン時に起動</span><small>画面を開かず、QMemを使える状態にします。</small></span><input id="autostart" class="toggle" type="checkbox" role="switch" /></label>
      </section>
      <section class="settings-section" aria-labelledby="shortcuts-title">
        <h2 id="shortcuts-title">ショートカット</h2>
        <label class="setting-row"><span>QMemを呼び出す</span><button class="shortcut-input" type="button" data-shortcut="global_shortcut"></button></label>
        <label class="setting-row"><span>新規メモ</span><button class="shortcut-input" type="button" data-shortcut="new_note_shortcut"></button></label>
        <label class="setting-row"><span>過去メモ検索</span><button class="shortcut-input" type="button" data-shortcut="search_shortcut"></button></label>
        <p id="shortcut-help" class="setting-help">変更する項目を押して、キーを入力します。</p>
      </section>
      <section class="settings-section" aria-labelledby="appearance-title">
        <h2 id="appearance-title">表示</h2>
        <label class="font-setting"><span>文字サイズ</span><input id="font-size" type="range" min="15" max="24" step="1" /><output id="font-size-value" for="font-size"></output></label>
      </section>
      <p id="settings-status" class="settings-status" role="status" hidden></p>
    </dialog>
    <!-- 保存・読み込みに失敗した場合だけ表示する通知領域。 -->
    <p id="error" role="alert" hidden></p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
